<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GridPop banner, desktop</title>
<link rel="stylesheet" href="brand.css">
<script src="fontcheck.js"></script>
<style>
  html, body { width: 1072px; height: 128px; }
  body {
    position: relative;
    --warm-peach: 620px 220px;
    --warm-lilac: 560px 260px;
    --warm-sky: 640px 150px;
  }
  .abs { position: absolute; }

  /* Centered: narrow windows crop both sides equally, and the avatar sits bottom-left. */
  .brand {
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
  }
  .brand .logo { font-size: 62px; }
  .tagline {
    font-family: "Nunito", sans-serif;
    font-weight: 900;
    font-size: 14px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gp-muted);
  }
  .tagline em { font-style: normal; color: var(--gp-accent); }

  .board-main { --w: 196px; left: 852px; top: -34px; transform: rotate(8deg); }

  .loose .tile { position: absolute; }
</style>
</head>
<body class="gp-warm">
  <div class="loose">
    <div class="tile v5" style="--s: 46px; left: 132px; top: -12px; transform: rotate(-12deg)"><span>5</span></div>
    <div class="tile v4" style="--s: 38px; left: 214px; top: 30px; transform: rotate(9deg)"><span>4</span></div>
    <div class="tile v2" style="--s: 30px; left: 60px; top: 30px; transform: rotate(6deg)"><span>2</span></div>

    <div class="tile v1" style="--s: 40px; left: 762px; top: 14px; transform: rotate(-8deg)"><span>1</span></div>
    <div class="tile v6" style="--s: 34px; left: 796px; top: 76px; transform: rotate(10deg)"><span>6</span></div>
  </div>

  <div class="abs brand">
    <div class="logo">
      <span class="logo-mark"><i style="background:#FFD45E"></i><i style="background:#7CCBFF"></i><i style="background:#7BDEA3"></i><i style="background:#FF5A6E"></i></span>
      <span class="logo-word">Grid</span>
      <span class="logo-pop"><span class="logo-tile lp1"><b>P</b></span><span class="logo-tile lp2"><b>O</b></span><span class="logo-tile lp3"><b>P</b></span></span>
    </div>
    <div class="tagline">A new puzzle <em>every day</em></div>
  </div>

  <div class="abs board board-main">
    <div class="socket"><div class="tile v1"><span>1</span></div></div>
    <div class="socket"><div class="tile v2"><span>2</span></div></div>
    <div class="socket"></div>
    <div class="socket"><div class="tile v4"><span>4</span></div></div>

    <div class="socket"><div class="tile v3"><span>3</span></div></div>
    <div class="socket"><div class="tile v3"><span>3</span></div></div>
    <div class="socket"><div class="tile v3"><span>3</span></div></div>
    <div class="socket"><div class="tile v3"><span>3</span></div></div>

    <div class="socket"><div class="tile v2"><span>2</span></div></div>
    <div class="socket"></div>
    <div class="socket"><div class="tile v5"><span>5</span></div></div>
    <div class="socket"><div class="tile v1"><span>1</span></div></div>

    <div class="socket"><div class="tile v1"><span>1</span></div></div>
    <div class="socket"><div class="tile v4"><span>4</span></div></div>
    <div class="socket"><div class="tile v2"><span>2</span></div></div>
    <div class="socket"></div>

    <div class="will-clear" style="grid-area: 2 / 1 / 3 / 5; inset: -4px"></div>
  </div>
</body>
</html>
