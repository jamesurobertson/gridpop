<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GridPop share image</title>
<link rel="stylesheet" href="brand.css">
<script src="fontcheck.js"></script>
<style>
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative;
    --warm-peach: 900px 520px;
    --warm-lilac: 820px 560px;
    --warm-sky: 900px 380px;
  }
  .abs { position: absolute; }

  /* Kept inside the middle ~1000px: some apps crop the sides of wide previews. */
  .brand {
    left: 104px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 26px;
  }
  .brand .logo { font-size: 94px; }
  .headline {
    font-family: "Fredoka", sans-serif;
    font-weight: 700;
    font-size: 46px;
    line-height: 1.12;
    color: var(--gp-ink);
  }
  .tagline {
    font-family: "Nunito", sans-serif;
    font-weight: 900;
    font-size: 22px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gp-muted);
  }
  .tagline em { font-style: normal; color: var(--gp-accent); }

  .board-main { --w: 352px; left: 764px; top: 132px; transform: rotate(6deg); box-shadow: 0 22px 0 rgba(31, 22, 51, 0.12); }
  .loose .tile { position: absolute; }
</style>
</head>
<body class="gp-warm">
  <div class="loose">
    <div class="tile v5" style="--s: 70px; left: 712px; top: 74px; transform: rotate(-12deg)"><span>5</span></div>
    <div class="tile v1" style="--s: 58px; left: 1096px; top: 70px; transform: rotate(10deg)"><span>1</span></div>
    <div class="tile v6" style="--s: 62px; left: 1080px; top: 500px; transform: rotate(-8deg)"><span>6</span></div>
    <div class="tile v2" style="--s: 50px; left: 720px; top: 522px; transform: rotate(7deg)"><span>2</span></div>
  </div>

  <div class="abs brand">
    <div class="logo">
      <span class="logo-mark"><i style="background:#FFD45E"></i><i style="background:#7CCBFF"></i><i style="background:#7BDEA3"></i><i style="background:#FF5A6E"></i></span>
      <span class="logo-word">Grid</span>
      <span class="logo-pop"><span class="logo-tile lp1"><b>P</b></span><span class="logo-tile lp2"><b>O</b></span><span class="logo-tile lp3"><b>P</b></span></span>
    </div>
    <div class="headline">Match the target.<br>Fewest pieces wins.</div>
    <div class="tagline">A new puzzle <em>every day</em></div>
  </div>

  <div class="abs board board-main">
    <div class="socket"><div class="tile v1"><span>1</span></div></div>
    <div class="socket"><div class="tile v2"><span>2</span></div></div>
    <div class="socket"></div>
    <div class="socket"><div class="tile v4"><span>4</span></div></div>

    <div class="socket"><div class="tile v3"><span>3</span></div></div>
    <div class="socket"><div class="tile v3"><span>3</span></div></div>
    <div class="socket"><div class="tile v3"><span>3</span></div></div>
    <div class="socket"><div class="tile v3"><span>3</span></div></div>

    <div class="socket"><div class="tile v2"><span>2</span></div></div>
    <div class="socket"></div>
    <div class="socket"><div class="tile v5"><span>5</span></div></div>
    <div class="socket"><div class="tile v1"><span>1</span></div></div>

    <div class="socket"><div class="tile v1"><span>1</span></div></div>
    <div class="socket"><div class="tile v4"><span>4</span></div></div>
    <div class="socket"><div class="tile v2"><span>2</span></div></div>
    <div class="socket"></div>

    <div class="will-clear" style="grid-area: 2 / 1 / 3 / 5; inset: -6px"></div>
  </div>
</body>
</html>
