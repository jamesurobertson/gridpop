<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GridPop video stage</title>
<link rel="stylesheet" href="brand.css">
<script src="fontcheck.js"></script>
<style>
  /* One 1920x1080 stage recorded start to finish. The real game (an iframe of the dev server) fills
     the frame behind a "camera" that zooms and shakes; short cards pop over it between beats; an
     intro and an end card bookend it. video/record.mjs drives it through window.stage. */
  html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; }
  body { position: relative; background: var(--gp-bg); }
  .layer { position: absolute; inset: 0; }

  /* ---------- the game, behind the camera ---------- */
  #camera {
    transform-origin: 960px 540px;
    transition: transform 750ms cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  #camera.snap { transition: transform 160ms cubic-bezier(0.3, 1.4, 0.5, 1); }
  #camera iframe { width: 1920px; height: 1080px; border: 0; display: block; }
  .shake { animation: shake 360ms linear; }
  @keyframes shake {
    20% { transform: translate(10px, -6px) rotate(0.4deg); }
    40% { transform: translate(-9px, 7px) rotate(-0.4deg); }
    60% { transform: translate(6px, 4px); }
    80% { transform: translate(-4px, -3px); }
  }

  /* ---------- cards ---------- */
  .card {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px;
    background: var(--fill); transform: translateX(105%);
    overflow: hidden;
  }
  .card.in { animation: wipe-in 300ms cubic-bezier(0.2, 0.9, 0.2, 1) forwards; }
  .card.in.out { animation: wipe-out 300ms cubic-bezier(0.6, 0, 0.8, 0.4) forwards; }
  @keyframes wipe-in { from { transform: translateX(105%) skewX(-6deg); } to { transform: translateX(0); } }
  @keyframes wipe-out { from { transform: translateX(0); } to { transform: translateX(-105%) skewX(6deg); } }
  .card .words { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 34px; max-width: 1600px; }
  .card .word {
    font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 190px; line-height: 1.08;
    color: #fff; -webkit-text-stroke: 7px var(--gp-stroke); paint-order: stroke fill;
    text-shadow: 0 12px 0 var(--gp-stroke);
    opacity: 0; transform: translateY(90px) scale(0.5) rotate(var(--tilt));
  }
  .card.in .word { animation: bounce-in 520ms cubic-bezier(0.3, 1.7, 0.5, 1) forwards; }
  @keyframes bounce-in { to { opacity: 1; transform: translateY(0) scale(1) rotate(var(--tilt)); } }
  .card .word.hot { color: var(--hot, #FFD45E); }
  .card .deco { position: absolute; }

  /* ---------- POP! burst ---------- */
  #burst { pointer-events: none; }
  #burst .pop {
    position: absolute; transform: translate(-50%, -50%) scale(0); opacity: 0;
    width: 620px; height: 620px; display: grid; place-items: center;
  }
  #burst .star {
    position: absolute; inset: 0; background: #FFD45E; border: 0;
    clip-path: polygon(50% 0%, 59% 26%, 85% 10%, 73% 36%, 100% 40%, 76% 55%, 95% 79%, 66% 72%, 60% 100%, 48% 76%, 30% 96%, 30% 68%, 4% 80%, 20% 56%, 0% 36%, 27% 34%, 15% 8%, 41% 24%);
    filter: drop-shadow(0 0 0 #1F1633);
  }
  #burst .star.back { background: #1F1633; transform: scale(1.06); }
  #burst .label {
    position: relative; font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 170px; color: #FF5A6E;
    -webkit-text-stroke: 8px #1F1633; paint-order: stroke fill; text-shadow: 0 10px 0 #1F1633; transform: rotate(-8deg);
  }
  #burst .pop.go { animation: burst 900ms cubic-bezier(0.3, 1.6, 0.5, 1) forwards; }
  @keyframes burst {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(0) rotate(-20deg); }
    35% { opacity: 1; transform: translate(-50%, -50%) scale(1.08) rotate(4deg); }
    70% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.25) rotate(0deg); }
  }

  /* ---------- intro and end ---------- */
  .title { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px; background: var(--gp-bg); }
  .title.gp-warm { --warm-peach: 1400px 900px; --warm-lilac: 1300px 1000px; --warm-sky: 1500px 600px; }
  .title .logo { font-size: 210px; position: relative; z-index: 2; }
  .title .logo { opacity: 0; transform: scale(0.4); }
  .title.go .logo { animation: logo-in 700ms cubic-bezier(0.3, 1.6, 0.5, 1) forwards; }
  @keyframes logo-in { to { opacity: 1; transform: scale(1); } }
  .title .logo-tile { animation: none; }
  .title.go .logo-tile { animation: wiggle 1000ms 700ms ease-in-out infinite alternate; }
  .title.go .logo-tile.lp2 { animation-delay: 850ms; }
  .title.go .logo-tile.lp3 { animation-delay: 1000ms; }
  @keyframes wiggle { from { transform: rotate(var(--r)) translateY(0); } to { transform: rotate(calc(var(--r) * -1)) translateY(-14px); } }
  .title .sub {
    font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 84px; color: var(--gp-ink); position: relative; z-index: 2;
    opacity: 0; transform: translateY(30px);
  }
  .title.go .sub { animation: rise 500ms 450ms cubic-bezier(0.3, 1.5, 0.5, 1) forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .title .cta {
    font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 64px; color: #fff; position: relative; z-index: 2;
    background: #ff4500; border: 6px solid var(--gp-stroke); border-radius: 999px; padding: 16px 64px 22px;
    box-shadow: 0 10px 0 var(--gp-stroke); opacity: 0; transform: translateY(30px) scale(0.8);
  }
  .title.go .cta { animation: rise 500ms 800ms cubic-bezier(0.3, 1.6, 0.5, 1) forwards, throb 900ms 1400ms ease-in-out infinite alternate; }
  @keyframes throb { from { transform: scale(1); } to { transform: scale(1.06); } }
  .rain .tile { position: absolute; top: -160px; animation: fall var(--d) var(--delay) cubic-bezier(0.5, 0, 0.75, 0.3) forwards; }
  @keyframes fall { to { transform: translateY(1400px) rotate(var(--spin)); } }

  .hidden { display: none; }
</style>
</head>
<body>
  <div id="camera" class="layer"><iframe id="game" src="about:blank"></iframe></div>
  <div id="burst" class="layer"><div class="pop"><div class="star back"></div><div class="star"></div><div class="label">POP!</div></div></div>
  <div id="cards" class="layer"></div>

  <div id="intro" class="layer title gp-warm">
    <div class="rain layer"></div>
    <div class="logo">
      <span class="logo-mark"><i style="background:#FFD45E"></i><i style="background:#7CCBFF"></i><i style="background:#7BDEA3"></i><i style="background:#FF5A6E"></i></span>
      <span class="logo-word">Grid</span>
      <span class="logo-pop"><span class="logo-tile lp1"><b>P</b></span><span class="logo-tile lp2"><b>O</b></span><span class="logo-tile lp3"><b>P</b></span></span>
    </div>
    <div class="sub">A Daily Number Puzzle</div>
  </div>

  <div id="end" class="layer title gp-warm hidden">
    <div class="rain layer"></div>
    <div class="logo">
      <span class="logo-mark"><i style="background:#FFD45E"></i><i style="background:#7CCBFF"></i><i style="background:#7BDEA3"></i><i style="background:#FF5A6E"></i></span>
      <span class="logo-word">Grid</span>
      <span class="logo-pop"><span class="logo-tile lp1"><b>P</b></span><span class="logo-tile lp2"><b>O</b></span><span class="logo-tile lp3"><b>P</b></span></span>
    </div>
    <div class="sub">A new puzzle every day</div>
    <div class="cta">Play on r/gridpop</div>
  </div>

  <script>
    const FILLS = ["#7C5CFF", "#FF9D5C", "#45D486", "#4FC3FF", "#FF5A6E"];
    const TILE_FACES = ["v1", "v2", "v3", "v4", "v5", "v6"];
    let seed = 7;
    const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    let cardCount = 0;

    function rain(layer, count) {
      for (let i = 0; i < count; i++) {
        const value = 1 + Math.floor(rand() * 6);
        const tile = document.createElement("div");
        tile.className = `tile ${TILE_FACES[value - 1]}`;
        tile.innerHTML = `<span>${value}</span>`;
        const size = 60 + rand() * 90;
        tile.style.cssText = `--s:${size}px; left:${rand() * 1860}px; --d:${1.6 + rand() * 1.6}s; --delay:${rand() * 2.2}s; --spin:${(rand() * 2 - 1) * 260}deg; opacity:${0.55 + rand() * 0.45}`;
        layer.appendChild(tile);
      }
    }

    window.stage = {
      intro() {
        const intro = document.getElementById("intro");
        intro.classList.add("go");
        rain(intro.querySelector(".rain"), 26);
      },
      introOut() {
        const intro = document.getElementById("intro");
        intro.style.transition = "transform 420ms cubic-bezier(0.6, 0, 0.8, 0.4), opacity 420ms";
        intro.style.transform = "scale(1.6)";
        intro.style.opacity = "0";
      },
      /** A card of big bouncing words; `hot` lists the words to color. */
      card(text, hot = []) {
        const fill = FILLS[cardCount++ % FILLS.length];
        const card = document.createElement("div");
        card.className = "layer card";
        card.style.setProperty("--fill", fill);
        card.style.setProperty("--hot", fill === "#FF9D5C" || fill === "#FF5A6E" ? "#FFD45E" : "#FFD45E");
        const words = text.split(" ").map((word, i) => {
          const tilt = (i % 2 ? 1 : -1) * (2 + (i % 3));
          return `<span class="word${hot.includes(word) ? " hot" : ""}" style="--tilt:${tilt}deg; animation-delay:${80 + i * 90}ms">${word}</span>`;
        });
        card.innerHTML = `<div class="words">${words.join("")}</div>`;
        // A few tiles tumbling around the edges.
        for (let i = 0; i < 6; i++) {
          const value = 1 + Math.floor(rand() * 6);
          const tile = document.createElement("div");
          tile.className = `tile deco ${TILE_FACES[value - 1]}`;
          tile.innerHTML = `<span>${value}</span>`;
          // Kept to the edges, clear of the words.
          const left = i % 2 ? 1720 + rand() * 90 : 30 + rand() * 90;
          tile.style.cssText = `--s:${60 + rand() * 50}px; left:${left}px; top:${40 + (i >> 1) * 340 + rand() * 180}px; transform: rotate(${(rand() * 2 - 1) * 25}deg)`;
          card.appendChild(tile);
        }
        document.getElementById("cards").appendChild(card);
        void card.offsetWidth;
        card.classList.add("in");
        return cardCount;
      },
      cardOut() {
        const card = document.querySelector("#cards .card:last-child");
        if (!card) return;
        card.classList.add("out");
        setTimeout(() => card.remove(), 400);
      },
      /** Centers the camera on (x, y) of the 1920x1080 game, at `scale`. */
      camera(scale, x = 960, y = 540, snap = false) {
        const camera = document.getElementById("camera");
        camera.classList.toggle("snap", snap);
        camera.style.transformOrigin = `${x}px ${y}px`;
        camera.style.transform = `translate(${960 - x}px, ${540 - y}px) scale(${scale})`;
      },
      shake() {
        const layer = document.getElementById("game");
        layer.classList.remove("shake");
        void layer.offsetWidth;
        layer.classList.add("shake");
      },
      pop(x, y) {
        const pop = document.querySelector("#burst .pop");
        pop.style.left = `${x}px`;
        pop.style.top = `${y}px`;
        pop.classList.remove("go");
        void pop.offsetWidth;
        pop.classList.add("go");
      },
      end() {
        const end = document.getElementById("end");
        end.classList.remove("hidden");
        end.classList.add("go");
        rain(end.querySelector(".rain"), 30);
      },
    };
  </script>
</body>
</html>
