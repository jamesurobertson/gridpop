<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GridPop banner, mobile</title>
<link rel="stylesheet" href="brand.css">
<script src="fontcheck.js"></script>
<style>
  html, body { width: 1080px; height: 128px; }
  body {
    position: relative;
    --warm-peach: 620px 220px;
    --warm-lilac: 560px 260px;
    --warm-sky: 640px 150px;
  }
  .abs { position: absolute; }

  /* Centered: the apps may crop the sides, so the wordmark stays in the middle ~420px. */
  .brand {
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
  }
  .brand .logo { font-size: 68px; }

  .board-left { --w: 176px; left: 36px; top: -22px; transform: rotate(-9deg); }
  .board-right { --w: 176px; left: 862px; top: -30px; transform: rotate(8deg); }

  .loose .tile { position: absolute; }
</style>
</head>
<body class="gp-warm">
  <div class="abs board board-left">
    <div class="socket"><div class="tile v2"><span>2</span></div></div>
    <div class="socket"></div>
    <div class="socket"><div class="tile v1"><span>1</span></div></div>
    <div class="socket"><div class="tile v4"><span>4</span></div></div>

    <div class="socket"><div class="tile v1"><span>1</span></div></div>
    <div class="socket"><div class="tile v5"><span>5</span></div></div>
    <div class="socket"></div>
    <div class="socket"><div class="tile v2"><span>2</span></div></div>

    <div class="socket"><div class="tile v4"><span>4</span></div></div>
    <div class="socket"><div class="tile v2"><span>2</span></div></div>
    <div class="socket"><div class="tile v3"><span>3</span></div></div>
    <div class="socket"><div class="tile v1"><span>1</span></div></div>

    <div class="socket"></div>
    <div class="socket"><div class="tile v1"><span>1</span></div></div>
    <div class="socket"><div class="tile v2"><span>2</span></div></div>
    <div class="socket"><div class="tile v6"><span>6</span></div></div>
  </div>

  <div class="loose">
    <div class="tile v5" style="--s: 40px; left: 236px; top: 14px; transform: rotate(-10deg)"><span>5</span></div>
    <div class="tile v3" style="--s: 32px; left: 262px; top: 74px; transform: rotate(8deg)"><span>3</span></div>

    <div class="tile v1" style="--s: 40px; left: 800px; top: 16px; transform: rotate(-8deg)"><span>1</span></div>
    <div class="tile v6" style="--s: 32px; left: 780px; top: 76px; transform: rotate(10deg)"><span>6</span></div>
  </div>

  <div class="abs brand">
    <div class="logo">
      <span class="logo-mark"><i style="background:#FFD45E"></i><i style="background:#7CCBFF"></i><i style="background:#7BDEA3"></i><i style="background:#FF5A6E"></i></span>
      <span class="logo-word">Grid</span>
      <span class="logo-pop"><span class="logo-tile lp1"><b>P</b></span><span class="logo-tile lp2"><b>O</b></span><span class="logo-tile lp3"><b>P</b></span></span>
    </div>
  </div>

  <div class="abs board board-right">
    <div class="socket"><div class="tile v1"><span>1</span></div></div>
    <div class="socket"><div class="tile v2"><span>2</span></div></div>
    <div class="socket"></div>
    <div class="socket"><div class="tile v4"><span>4</span></div></div>

    <div class="socket"><div class="tile v3"><span>3</span></div></div>
    <div class="socket"><div class="tile v3"><span>3</span></div></div>
    <div class="socket"><div class="tile v3"><span>3</span></div></div>
    <div class="socket"><div class="tile v3"><span>3</span></div></div>

    <div class="socket"><div class="tile v2"><span>2</span></div></div>
    <div class="socket"></div>
    <div class="socket"><div class="tile v5"><span>5</span></div></div>
    <div class="socket"><div class="tile v1"><span>1</span></div></div>

    <div class="socket"><div class="tile v1"><span>1</span></div></div>
    <div class="socket"><div class="tile v4"><span>4</span></div></div>
    <div class="socket"><div class="tile v2"><span>2</span></div></div>
    <div class="socket"></div>

    <div class="will-clear" style="grid-area: 2 / 1 / 3 / 5; inset: -4px"></div>
  </div>
</body>
</html>
